<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Transaction Loader KPI inspector</title><desc id="desc">Synthetic computed KPI panel summarizing five child partitions, schedule horizon, resources, appointments, territories, tasks, and assignment outcomes.</desc>
  <rect width="1600" height="520" fill="#0b1017"/><g font-family="Segoe UI,sans-serif"><text x="18" y="28" fill="#9fb0c8" font-size="13">TRANSACTION KPIS (COMPUTED)</text><line x1="0" y1="42" x2="1600" y2="42" stroke="#303a49"/>
  <g font-size="12"><text x="20" y="70" fill="#8496aa">request.json</text><text x="115" y="70" fill="#8496aa">fetch.json</text><text x="197" y="70" fill="#8496aa">response.json</text></g>
  <g><rect x="18" y="84" width="100" height="32" fill="#171d25" stroke="#303a49"/><text x="68" y="105" text-anchor="middle" fill="#8496aa" font-size="12">Request</text><rect x="118" y="84" width="105" height="32" fill="#171d25" stroke="#303a49"/><text x="170" y="105" text-anchor="middle" fill="#8496aa" font-size="12">Engine input</text><rect x="223" y="84" width="115" height="32" fill="#171d25" stroke="#303a49"/><text x="280" y="105" text-anchor="middle" fill="#8496aa" font-size="12">Engine output</text><rect x="338" y="84" width="118" height="32" fill="#0f151d" stroke="#58a6ff"/><text x="397" y="105" text-anchor="middle" fill="#eef4fb" font-size="12" font-weight="700">Final response</text></g>
  <text x="18" y="143" fill="#eef4fb" font-size="13" font-weight="700">Totals (5 partitions)</text>
  <g font-family="Consolas,monospace"><rect x="26" y="164" width="760" height="45" rx="5" fill="#1b222c" stroke="#303a49"/><text x="406" y="184" text-anchor="middle" fill="#55dc86" font-size="14">Apr 01 08:00</text><text x="406" y="199" text-anchor="middle" fill="#8496aa" font-size="10">earliest appointment</text><rect x="798" y="164" width="776" height="45" rx="5" fill="#1b222c" stroke="#303a49"/><text x="1186" y="184" text-anchor="middle" fill="#55dc86" font-size="14">May 01 17:30</text><text x="1186" y="199" text-anchor="middle" fill="#8496aa" font-size="10">latest appointment</text>
  <g font-size="14"><rect x="26" y="242" width="370" height="45" rx="5" fill="#1b222c" stroke="#58a6ff"/><text x="211" y="262" text-anchor="middle" fill="#58a6ff" font-weight="700">120</text><text x="211" y="278" text-anchor="middle" fill="#8496aa" font-size="10">resources</text><rect x="404" y="242" width="370" height="45" rx="5" fill="#1b222c" stroke="#58a6ff"/><text x="589" y="262" text-anchor="middle" fill="#58a6ff" font-weight="700">4,200</text><text x="589" y="278" text-anchor="middle" fill="#8496aa" font-size="10">source appointments</text><rect x="782" y="242" width="370" height="45" rx="5" fill="#1b222c" stroke="#58a6ff"/><text x="967" y="262" text-anchor="middle" fill="#58a6ff" font-weight="700">4,200</text><text x="967" y="278" text-anchor="middle" fill="#8496aa" font-size="10">final appointments</text><rect x="1160" y="242" width="414" height="45" rx="5" fill="#1b222c" stroke="#303a49"/><text x="1367" y="262" text-anchor="middle" fill="#58a6ff" font-weight="700">4,200</text><text x="1367" y="278" text-anchor="middle" fill="#8496aa" font-size="10">changed objects</text></g>
  <rect x="26" y="302" width="370" height="45" rx="5" fill="#1b222c" stroke="#303a49"/><text x="211" y="322" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">18</text><text x="211" y="338" text-anchor="middle" fill="#8496aa" font-size="10">territories</text><rect x="404" y="302" width="370" height="45" rx="5" fill="#1b222c" stroke="#303a49"/><text x="589" y="322" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">120</text><text x="589" y="338" text-anchor="middle" fill="#8496aa" font-size="10">territory resources</text><rect x="782" y="302" width="370" height="45" rx="5" fill="#1b222c" stroke="#303a49"/><text x="967" y="322" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">3,950</text><text x="967" y="338" text-anchor="middle" fill="#8496aa" font-size="10">scheduled tasks</text><rect x="1160" y="302" width="414" height="45" rx="5" fill="#1b222c" stroke="#303a49"/><text x="1367" y="322" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">250</text><text x="1367" y="338" text-anchor="middle" fill="#8496aa" font-size="10">unassigned tasks</text>
  <rect x="26" y="362" width="370" height="45" rx="5" fill="#1b222c" stroke="#303a49"/><text x="211" y="382" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">3,900</text><text x="211" y="398" text-anchor="middle" fill="#8496aa" font-size="10">tasks</text><rect x="404" y="362" width="370" height="45" rx="5" fill="#1b222c" stroke="#303a49"/><text x="589" y="382" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">3,760</text><text x="589" y="398" text-anchor="middle" fill="#8496aa" font-size="10">task appointments</text><rect x="782" y="362" width="370" height="45" rx="5" fill="#1b222c" stroke="#303a49"/><text x="967" y="382" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">140</text><text x="967" y="398" text-anchor="middle" fill="#8496aa" font-size="10">unscheduled resources</text><rect x="1160" y="362" width="414" height="45" rx="5" fill="#1b222c" stroke="#303a49"/><text x="1367" y="382" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">0</text><text x="1367" y="398" text-anchor="middle" fill="#8496aa" font-size="10">invalid assignments</text></g>
  <text x="26" y="470" fill="#8496aa" font-size="12">Synthetic values preserve the diagnostic shape without exposing customer scale or transaction content.</text></g>
